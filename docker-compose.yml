# Notra — app container (SPEC §19).
#
# This compose file runs ONLY the Next.js app. Supabase is deliberately NOT
# re-implemented here — it is its own official Docker stack. Two supported
# paths (documented in the README, "Self-hosting"):
#
#   (a) Hosted Supabase: create a project at supabase.com, put its URL/keys
#       in .env.local (or .env), then:
#           docker compose up --build
#
#   (b) Self-hosted Supabase: run Supabase's official self-hosting stack
#       (https://supabase.com/docs/guides/self-hosting — its own
#       `docker compose` setup) on the same host, apply the migrations in
#       supabase/migrations/ via its Studio SQL editor, and point the
#       NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY /
#       SUPABASE_SERVICE_ROLE_KEY env vars at it (e.g. http://localhost:8000
#       with the demo keys from that stack, replaced with your own).
#
# Required env vars (see .env.example): NEXT_PUBLIC_SUPABASE_URL,
# NEXT_PUBLIC_SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY,
# NEXT_PUBLIC_APP_URL, ADMIN_SECRET_PATH, ENCRYPTION_KEY.

services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    # NEXT_PUBLIC_* vars are read at build time; rebuild with them set if
    # your Supabase project changes:
    #   docker compose build --build-arg NEXT_PUBLIC_SUPABASE_URL=... \
    #     --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=...
    restart: unless-stopped
